name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      # Real Postgres so migrations and DB tests run in CI too
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spotwise
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/spotwise
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Migrate
        run: uv run alembic upgrade head
      - name: Test
        run: uv run pytest
      - name: Evals (rule agent, free; fails if accuracy drops below the gate)
        env:
          EVAL_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/spotwise_eval
        run: uv run python -m evals.runner --suite golden --agent rules --no-judge
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-report
          path: evals/reports/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Type check + build
        run: npm run build

  docker:
    # Build the production image (the one Render runs) and smoke-test it
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spotwise
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t spotwise-api .
      - name: Start container (plain postgresql:// URL, like Neon gives you)
        run: |
          docker run -d --name api --network host \
            -e DATABASE_URL=postgresql://postgres:postgres@localhost:5432/spotwise \
            -e PORT=8000 spotwise-api
      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            curl -sf localhost:8000/health && break
            sleep 2
          done
          curl -sf localhost:8000/health | grep '"db":"ok"'
          curl -sf "localhost:8000/prices?from=2025-11-01&to=2025-11-02" | grep '"count":0'
          curl -sf -X POST localhost:8000/chat -H 'content-type: application/json' \
            -d '{"message":"Who won the football match?"}' | grep 'event: done'
      - name: Container logs
        if: always()
        run: docker logs api
