name: Evals

# Manual run (EVAL-07). The free rule agent also runs on every push in ci.yml;
# use this to try the optional Claude agent (needs a paid ANTHROPIC_API_KEY).
on:
  workflow_dispatch:
    inputs:
      agent:
        description: "rules (free) or llm (Claude, paid)"
        type: choice
        options: [rules, llm]
        default: rules
      limit:
        description: "Only the first N questions (empty = all)"
        required: false
        default: ""
      judge:
        description: "Score answers with the LLM judge (paid)"
        type: boolean
        default: false

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spotwise
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/spotwise
      EVAL_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/spotwise_eval
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Repository variables (Settings → Secrets and variables → Actions → Variables)
      LLM_MODEL: ${{ vars.LLM_MODEL || 'claude-haiku-5-5' }}
      JUDGE_MODEL: ${{ vars.JUDGE_MODEL || 'claude-haiku-5-5' }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
    steps:
      - name: Check ANTHROPIC_API_KEY secret (only needed for llm / judge)
        if: inputs.agent == 'llm' || inputs.judge
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Add the ANTHROPIC_API_KEY repository secret first."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Run evals (exit 1 if the gate fails)
        # Inputs go through env vars, never pasted into the script (avoids injection)
        env:
          LIMIT: ${{ inputs.limit }}
          JUDGE: ${{ inputs.judge }}
          AGENT: ${{ inputs.agent }}
        run: |
          case "$AGENT" in rules|llm) ;; *) echo "::error::bad agent"; exit 1;; esac
          ARGS="--suite golden --agent $AGENT"
          if [ -n "$LIMIT" ]; then
            case "$LIMIT" in *[!0-9]*) echo "::error::limit must be a number"; exit 1;; esac
            ARGS="$ARGS --limit $LIMIT"
          fi
          if [ "$JUDGE" = "true" ]; then ARGS="$ARGS --judge"; else ARGS="$ARGS --no-judge"; fi
          uv run python -m evals.runner $ARGS
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-report
          path: evals/reports/
