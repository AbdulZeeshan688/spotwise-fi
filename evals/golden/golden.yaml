# Golden questions (EVAL-01), converted from docs/EVAL_SEED_QUESTIONS.md.
#
# Frozen clock: EVAL_NOW = 2025-11-15 10:00 Helsinki (Saturday, before tomorrow's prices).
# Fixture: 2025-09-17 .. 2025-11-15 (hourly until 30 Sep, 15-minute from 1 Oct, DST 26 Oct).
#
# Fields
#   expect          answer (default) | refusal (off-topic sentence) | not_available (explain, no guessing)
#   expected_tools  every listed tool must be called; "a|b" means either one
#   ground_truth    {fn, args}: a function in evals/ground_truth.py, computed from the fixture
#   checks          {fact: type}; each fact must appear in the answer
#                   types: price (c/kWh), eur, percent, count, hours, time (HH:MM), date
#   tolerance       optional overrides, e.g. {price: 0.02}
# Prices are c/kWh incl. 25.5% VAT unless the question says otherwise.

# --- A. Current price -------------------------------------------------------
- id: cur-001
  section: A
  question: "What's the electricity price right now?"
  expected_tools: [get_current_price]
  ground_truth: {fn: current_price, args: {}}
  checks: {price: price}

- id: cur-002
  section: A
  question: "How much does electricity cost at the moment, without VAT?"
  expected_tools: [get_current_price]
  ground_truth: {fn: current_price, args: {vat: false}}
  checks: {price: price}

- id: cur-003
  section: A
  question: "Is electricity cheap right now compared to today's average?"
  expected_tools: [get_current_price, get_price_stats|get_daily_averages]
  ground_truth: {fn: current_vs_period, args: {period: today}}
  checks: {price: price, mean: price}

- id: cur-004
  section: A
  question: "What will the price be at 18:00 today?"
  expected_tools: [get_prices|get_price_stats]
  ground_truth: {fn: price_at, args: {period: "today 18:00-18:15"}}
  checks: {price: price}

- id: cur-005
  section: A
  question: "What was the price at 07:30 this morning?"
  expected_tools: [get_prices|get_price_stats]
  ground_truth: {fn: price_at, args: {period: "today 07:30-07:45"}}
  checks: {price: price}

