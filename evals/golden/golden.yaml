# --- E. Costs ---------------------------------------------------------------
- id: cost-001
  section: E
  question: "How much does it cost to charge 40 kWh evenly between 22:00 and 06:00 last night?"
  expected_tools: [estimate_cost]
  ground_truth: {fn: cost, args: {period: "yesterday 22:00-06:00", kwh: "40"}}
  checks: {cost_incl: eur}

- id: cost-002
  section: E
  question: "If I use 10 kWh during today's cheapest 3-hour window, what does it cost?"
  expected_tools: [find_cheapest_window, estimate_cost]
  ground_truth: {fn: window_cost, args: {period: today, minutes: 180, kwh: "10"}}
  checks: {window_start: time, cost_incl: eur}

- id: cost-003
  section: E
  question: "Cost of a 2 kWh sauna session at 19:00 today (1 hour), with VAT?"
  expected_tools: [estimate_cost]
  ground_truth: {fn: cost, args: {period: "today 19:00-20:00", kwh: "2"}}
  checks: {cost_incl: eur}

- id: cost-004
  section: E
  question: "How much would I save by charging 30 kWh in today's cheapest 4 hours instead of the most expensive 4 hours?"
  notes: "The saving itself is a subtraction the agent may not do; both costs are checked."
  expected_tools: [find_cheapest_window, find_most_expensive_window, estimate_cost]
  ground_truth: {fn: window_costs, args: {period: today, minutes: 240, kwh: "30"}}
  checks: {cheap_cost: eur, dear_cost: eur}

- id: cost-005
  section: E
  question: "What would 15 kWh have cost on 2025-11-01 at that day's average price, without VAT?"
  expected_tools: [estimate_cost]
  ground_truth: {fn: cost, args: {period: "2025-11-01", kwh: "15"}}
  checks: {cost_excl: eur}

